name: DevSecOps Pipeline (Quality Gates)

# Compuertas de seguridad Shift-Left: el build se BLOQUEA si alguna falla.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-scanning:
    name: "Gate 1 - Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar y ejecutar Gitleaks (escaneo del arbol de trabajo)
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz gitleaks
          # --no-git escanea los archivos actuales (evita el error de rango en el commit raiz)
          ./gitleaks detect --source . --no-git --redact -v --exit-code 1

  sast:
    name: "Gate 2 - SAST (Semgrep OWASP)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: SAST bloqueante (reglas curadas del proyecto)
        run: semgrep scan --config ci/semgrep-rules.yml --error
      - name: Cobertura OWASP Top 10 (informativa, no bloqueante)
        run: semgrep scan --config p/owasp-top-ten || true

  sca:
    name: "Gate 3 - SCA (Trivy HIGH/CRITICAL)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (bloquea en HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" aquasecurity/trivy:latest fs \
            --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --ignore-unfixed /src

  build:
    name: "Build & Test"
    needs: [ secret-scanning, sast, sca ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node -e "require('./src/app.js'); console.log('build OK')"
